<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quickly and accurately calculate interest rates on loans with our easy-to-use interest rate calculator. Determine the interest you'll pay and make informed financial decisions. Try our free online calculator now."
    />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <title>Interest Rate Calculator- Quickly Calculate Interest on Loans</title>
  </head>
  <body>
    <main class="container">
      <h1>Interest Rate Calculator</h1>
      <form id="interest-form" novalidate>
        <div class="input-wrapper">
          <div class="wrapper">
            <label for="principal">Principal Amount</label>
            <input type="number" id="principal" value="1000" min="0" step="any" required />
          </div>
        </div>
        <div class="input-wrapper">
          <div class="wrapper">
            <label for="rate">Rate (%)</label>
            <input type="number" id="rate" value="5" min="0" step="any" required />
          </div>
        </div>
        <div class="input-wrapper">
          <div class="wrapper">
            <label for="time">Time (Years)</label>
            <input type="number" id="time" value="1" min="0" step="any" required />
          </div>
        </div>
        <button id="calculate-btn" type="submit">Calculate</button>
      </form>
      <div id="result" aria-live="polite" aria-atomic="true"></div>
    </main>
  </body>
</html>
